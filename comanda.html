<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comanda — Pizzaioli</title>
<link rel="icon" type="image/png" href="img/favicon-pizzaioli.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: 'Inter', sans-serif; color: #111;
    background: #ddd;
    padding: 30px 16px;
  }
  .toolbar {
    max-width: 380px; margin: 0 auto 16px; display:flex; gap:10px; justify-content:center;
  }
  .toolbar button {
    font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
  }
  .btn-print { background: #1B1712; color: #fff; }
  .btn-back { background: #fff; border: 1px solid #ccc !important; }

  .ticket {
    max-width: 380px; margin: 0 auto; background: #fff;
    padding: 24px 20px; font-size: 13px; line-height: 1.5;
  }
  .ticket-logo { font-family:'Instrument Serif', serif; font-style: italic; font-size: 24px; text-align:center; margin-bottom: 2px; }
  .ticket-tag { text-align:center; font-size: 11px; letter-spacing:2px; text-transform:uppercase; color:#555; margin-bottom: 14px; }
  .ticket-codigo { text-align:center; font-family:'Instrument Serif', serif; font-size: 30px; font-weight:600; margin-bottom: 4px; }
  .ticket-fecha { text-align:center; font-size: 11px; color:#555; margin-bottom: 16px; }

  .ticket hr { border:none; border-top: 1px dashed #999; margin: 14px 0; }

  .ticket-section-label { font-size: 10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#555; margin-bottom: 6px; }
  .ticket-line { display:flex; justify-content:space-between; margin-bottom: 2px; }

  .item-row { display:flex; justify-content:space-between; padding: 6px 0; border-bottom: 1px dotted #ddd; }
  .item-qty { font-weight:700; width: 30px; flex-shrink:0; }
  .item-name { flex:1; }
  .item-price { font-weight: 500; }

  .ticket-total-row { display:flex; justify-content:space-between; font-size: 14px; padding: 3px 0; }
  .ticket-total-final { font-size: 18px; font-weight:700; padding-top: 8px; border-top: 1px solid #111; margin-top: 6px; }

  .ticket-nota {
    margin-top: 16px; padding: 10px 12px; background: #f5f0e5; border-radius: 6px; font-size: 12px;
  }
  .ticket-footer { text-align:center; font-size: 11px; color:#888; margin-top: 20px; }

  #loading, #errorMsg { max-width: 380px; margin: 60px auto; text-align:center; color:#555; }
  #errorMsg { display:none; color:#a33; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .ticket { box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-back" onclick="window.close()">← Volver</button>
  <button class="btn-print" onclick="window.print()">🖨 Imprimir comanda</button>
</div>

<p id="loading">Cargando comanda...</p>
<p id="errorMsg">No se pudo cargar este pedido. Verifica que iniciaste sesión en el panel.</p>

<div class="ticket" id="ticket" style="display:none">
  <div class="ticket-logo">Pizzaioli</div>
  <div class="ticket-tag">Comanda de pedido</div>
  <div class="ticket-codigo" id="tCodigo"></div>
  <div class="ticket-fecha" id="tFecha"></div>

  <hr>

  <div class="ticket-section-label">Cliente</div>
  <div class="ticket-line"><span id="tNombre"></span></div>
  <div class="ticket-line"><span id="tTelefono"></span></div>

  <div class="ticket-section-label" style="margin-top:12px;">Entrega</div>
  <div class="ticket-line"><span id="tComuna"></span></div>
  <div class="ticket-line"><span id="tDireccion"></span></div>

  <hr>

  <div class="ticket-section-label">Pedido</div>
  <div id="tItems"></div>

  <div style="margin-top:10px;">
    <div class="ticket-total-row"><span>Subtotal</span><span id="tSubtotal"></span></div>
    <div class="ticket-total-row" id="tDescuentoRow" style="display:none;"><span>Descuento reserva</span><span id="tDescuento"></span></div>
    <div class="ticket-total-row ticket-total-final"><span>TOTAL</span><span id="tTotal"></span></div>
  </div>

  <div class="ticket-nota" id="tNota" style="display:none;"></div>

  <div class="ticket-footer">Pizzaioli — Providencia · Santiago Centro · Bellavista</div>
</div>

<script>
  const SUPABASE_URL = 'https://myjlesckaqiohmxyjppp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_VIFT-ZGkZ7_wGjtzCRIgiA_EXB3xHu8';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  function formatearCLP(v) { return '$' + v.toLocaleString('es-CL'); }
  function formatearFecha(iso) {
    return new Date(iso).toLocaleString('es-CL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  async function cargarComanda() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { mostrarError(); return; }

    // Verificar sesión (la comanda requiere estar logueado en el panel)
    const { data: sesion } = await db.auth.getSession();
    if (!sesion.session) { mostrarError(); return; }

    const { data: pedido, error: errPedido } = await db.from('orders').select('*').eq('id', id).single();
    if (errPedido || !pedido) { mostrarError(); return; }

    const { data: items, error: errItems } = await db.from('order_items').select('*').eq('order_id', id);
    if (errItems) { mostrarError(); return; }

    pintarComanda(pedido, items);
  }

  function mostrarError() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'block';
  }

  function pintarComanda(pedido, items) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('ticket').style.display = 'block';

    document.getElementById('tCodigo').textContent = '#' + pedido.codigo_seguimiento;
    document.getElementById('tFecha').textContent = formatearFecha(pedido.created_at);
    document.getElementById('tNombre').textContent = pedido.nombre_cliente;
    document.getElementById('tTelefono').textContent = pedido.telefono;
    document.getElementById('tComuna').textContent = pedido.comuna;
    document.getElementById('tDireccion').textContent = pedido.direccion || '(sin dirección especificada)';

    document.getElementById('tItems').innerHTML = items.map(i => `
      <div class="item-row">
        <span class="item-qty">${i.cantidad}×</span>
        <span class="item-name">${i.nombre_producto}</span>
        <span class="item-price">${formatearCLP(i.precio_unitario * i.cantidad)}</span>
      </div>
    `).join('');

    document.getElementById('tSubtotal').textContent = formatearCLP(pedido.subtotal);
    document.getElementById('tTotal').textContent = formatearCLP(pedido.total);

    if (pedido.descuento_aplicado > 0) {
      document.getElementById('tDescuentoRow').style.display = 'flex';
      document.getElementById('tDescuento').textContent = '−' + formatearCLP(pedido.descuento_aplicado);
    }

    if (pedido.es_reserva_anticipada) {
      document.getElementById('tNota').style.display = 'block';
      document.getElementById('tNota').textContent = 'Pedido reservado con anticipación — confirmar entrega viernes/sábado.';
    }
  }

  cargarComanda();
</script>
</body>
</html>
